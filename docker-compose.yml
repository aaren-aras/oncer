services:
  api:
    build: ./api
    image: oncer-api
    env_file:
      - .env
    ports:
      # Keep host and container ports the same
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./api/data:/workspace/Oncer/api/data
      - ./api/models:/workspace/Oncer/api/models

    ipc: host
    
    # Prevent imgaug crashes
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864 # increase stack size to 64 MB (67108864 bytes)
        hard: 67108864
    
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
