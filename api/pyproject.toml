[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncer"
version = "0.1.0"
description = "A backend microservice for segmenting brain tumours on structural MRI"
readme = "README.md"
requires-python = ">=3.11,<3.13" # TF 2.17 has no published wheels for Python 3.13+
license = { text = "MIT" }

# For core runtime and inferencing locally (main.py)
dependencies = [
    "python-dotenv>=1.0.0",
    "tensorflow==2.17.0",
    "numpy>=1.26.4,<2.0.0",
    "nibabel>=5.2.0",
    "pillow>=10.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.6",
]

# For data prep -> model training via NGC containers (data.py, model.py)
[project.optional-dependencies]
training = [
    "protobuf>=4.25.3",
    "matplotlib>=3.9.2",
    "scikit-learn>=1.5.2",
    "imgaug==0.4.0",
    "tqdm>=4.66.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]